name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Find project folder
        id: find
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          echo "Found: $F"
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: gunmod-jar
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
